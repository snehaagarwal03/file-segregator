[project]
name = "file-segregator"
version = "0.1.0"
description = "AI-powered download folder organizer — watches a folder, renames files with LLM reasoning, and moves them into categorized subfolders."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "groq>=0.31.1",
    "python-dotenv>=1.0.1",
    "schedule>=1.2.2",
    "pdfplumber>=0.11.4",
    "python-docx>=1.1.2",
]

[dependency-groups]
dev = []
